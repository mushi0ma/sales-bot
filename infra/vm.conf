# Parameters of the test VM. Sourced by infra/vm.sh. No secrets here.
VM_NAME=sales-bot-vm
VM_USER=dev
VM_CPUS=4
VM_RAM_MB=6144
VM_DISK_SIZE=60G
# Host-side SSH forward (passt), bound to loopback only.
SSH_BIND=127.0.0.1
SSH_PORT=2222
# Web UIs reached through `vm.sh tunnel` (ssh -L), host loopback only.
TUNNEL_PORTS="3000 3100"
# Guest DNS: public resolvers (host resolver is unreachable by design: --no-map-gw).
GUEST_DNS="1.1.1.1, 9.9.9.9"

UBUNTU_IMG_URL=https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
UBUNTU_SUMS_URL=https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS
