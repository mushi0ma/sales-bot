# sales-bot stack on the Google Cloud VM: Chatwoot fork (+ embedded native WhatsApp connector) + fazer.ai agents,
# Gemini on Vertex AI through LiteLLM, HTTPS through Caddy.
# Built from ../vendor (deploy/vm/fetch-vendor.sh) ON the VM. Secrets come from ./.env, which render-env.sh builds
# from Secret Manager; never from this file. Only Caddy is public (80/443); everything else binds to 127.0.0.1
# of the VM or stays inside docker networks (the agents console: deploy/ssh.sh -- -N -L 3100:127.0.0.1:3100).
name: salesbot

x-cw-env: &cw-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  LOG_LEVEL: info
  DEFAULT_LOCALE: ru
  # Public address (Caddy, HTTPS) and the in-network address the connector fetches media from.
  FRONTEND_URL: https://${PUBLIC_DOMAIN:?run render-env.sh}
  INTERNAL_HOST_URL: http://cw-rails:3000
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run render-env.sh}
  POSTGRES_HOST: cw-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${CW_POSTGRES_PASSWORD:?}
  POSTGRES_DATABASE: chatwoot_production
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  ENABLE_ACCOUNT_SIGNUP: "false"
  DISABLE_TELEMETRY: "true"
  # Agent Bot webhooks to the agents service on the private docker network.
  SAFE_FETCH_PRIVATE_TARGETS: agents:3000,tg-userbot:8080,group-watcher:8080
  # Native WhatsApp connector (whatsmeow), embedded in Sidekiq.
  WHATSAPP_CONNECTOR_ENABLED: "true"
  # WhatsApp calls to the test number go to the voice agent (stack/voice, patch chatwoot-whatsapp-voice-agent):
  # the connector dials this stream on the docker network. Empty VOICE_AGENT_URL in .env turns it off.
  WHATSAPP_VOICE_AGENT_URL: ${VOICE_AGENT_URL-ws://voice:8090/wa}
  # Call voice to WhatsApp's relays leaves through this UDP port (outbound; replies come back on it).
  WAC_CALLS_UDP_PORT: "40000"
  WAC_CALLS_PUBLIC_IP: ${PUBLIC_IP:-34.187.89.79}
  WHATSAPP_CONNECTOR_EMBEDDED: "true"
  # Group chats (the sales task reads a test group). Off by default in the fork: group messages are dropped.
  WHATSAPP_GROUPS_ENABLED: "true"
  WAC_MEDIA_ROOT: /app/wac-media
  # Legacy Baileys/Z-API providers not offered.
  WHATSAPP_LEGACY_PROVIDERS_CREATABLE: "false"
  # WhatsApp Cloud webhooks must carry Meta's signature (app secret); the default accepts unsigned ones.
  WHATSAPP_ACCEPT_UNSIGNED_WEBHOOKS: "false"

services:
  cw-rails:
    build:
      context: ../vendor/chatwoot
      dockerfile: docker/Dockerfile
    image: salesbot/chatwoot:local
    environment: *cw-env
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, "3000", -b, 0.0.0.0]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cw_storage:/app/storage
    depends_on:
      cw-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  cw-sidekiq:
    image: salesbot/chatwoot:local
    pull_policy: never
    environment: *cw-env
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    ports: ["40000:40000/udp"]  # WhatsApp call voice (WAC_CALLS_UDP_PORT)
    volumes:
      - cw_storage:/app/storage
      - wac_media:/app/wac-media
    depends_on:
      cw-rails: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep [s]idekiq | grep -qv entrypoints"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  cw-postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CW_POSTGRES_PASSWORD:?}
    volumes:
      - cw_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agents:
    build:
      context: ../vendor/agents
    image: salesbot/agents:local
    networks: [default, internal]
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: http://localhost:3100
      CDN_URL: http://localhost:3100
      CORS_ORIGIN: http://localhost:3100
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      MIGRATION_DATABASE_URL: postgres://postgres:${AGENTS_POSTGRES_PASSWORD:?}@agents-postgres:5432/fazerai_agents_db
      DATABASE_URL: postgres://fazerai_app:${AGENTS_APP_DB_PASSWORD:?}@agents-postgres:5432/fazerai_agents_db
      LANGGRAPH_DATABASE_URL: postgres://fazerai_app:${AGENTS_APP_DB_PASSWORD:?}@agents-postgres:5432/fazerai_agents_db
      # Internal services reachable over http with the SSRF guard ON (host:port only): Chatwoot, the mock
      # dispatcher used by the ticket HTTP tools (tool allowedHosts must name it), the LiteLLM gateway to Gemini.
      SSRF_INTERNAL_TARGETS: cw-rails:3000,tickets:8080,litellm:4000
      # stack/patches/agents-embedding-dimensions.patch: ask Matryoshka embedders for 1536-wide vectors.
      EMBEDDING_SEND_DIMENSIONS: "true"
      # No calls to app.fazer.ai (announcements / update check).
      FAZER_AI_HUB_URL: ""
      SIGNUP_ENABLED: "false"
      SETUP_TOKEN_REQUIRED: "true"
      MCP_STDIO_ENABLED: "false"
      BRANDING_STORAGE_DIR: /app/storage/branding
      DOCUMENTS_STORAGE_DIR: /app/storage/documents
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - agents_storage:/app/storage
    depends_on:
      agents-postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
    restart: unless-stopped

  # Gemini on Vertex AI behind one OpenAI-compatible endpoint (http://litellm:4000/v1, key LITELLM_MASTER_KEY).
  # Vertex auth = the VM service account via the metadata server; hard per-model rpm/rpd limits in the config.
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3@sha256:f12d528d4a05add56cb09e54c5126088f2edc6bdf3a2f943bcd3a32b08769da2
    command: [--config, /app/config.yaml, --port, "4000", --num_workers, "1"]
    networks: [default]
    # VM loopback only: laptops reach it through `deploy/ssh.sh -- -N -L 4000:127.0.0.1:4000` (same limits for all).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      GCP_PROJECT: ${GCP_PROJECT:?run render-env.sh}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      LITELLM_LOG: WARNING
      LITELLM_TELEMETRY: "False"
      DISABLE_SCHEMA_UPDATE: "true"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Sales needs in WhatsApp groups -> private offers (path A). Chatwoot account webhook in, Chatwoot API and
  # LiteLLM out. Only groups labelled salesbot-watch. Config from `bootstrap.py group-watcher` (GW_* in stack/.env).
  group-watcher:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: [python3, -I, -u, /app/watcher.py, serve]
    networks: [default]
    environment:
      CW_ACCOUNT_ID: ${GW_CW_ACCOUNT_ID:-1}
      CW_API_TOKEN: ${GW_CW_TOKEN:-}
      WEBHOOK_SECRET: ${GW_WEBHOOK_SECRET:-}
      LLM_KEY: ${LITELLM_MASTER_KEY:?}
      LLM_MODEL: ${GW_MODEL:-gemini-3.5-flash-lite}
      # auto: send at once | approve: the operator answers the card with /offer N | dry: cards only
      SEND_MODE: ${GW_SEND_MODE:-auto}
      DAILY_SEND_CAP: ${GW_DAILY_SEND_CAP:-20}
      SEND_PATH: ${GW_SEND_PATH:-A}  # A | B | SPLIT (B needs GW_CLOUD_INBOX_ID and approved templates)
      CLOUD_INBOX_ID: ${GW_CLOUD_INBOX_ID:-0}
      AUTO_TESTERS: ${GW_AUTO_TESTERS:-true}  # test env: group members become testers (see watcher.py)
      DB_PATH: /data/watcher.db
    volumes:
      - ./group-watcher/watcher.py:/app/watcher.py:ro
      - ./group-watcher/services.json:/app/services.json:ro
      - ./group-watcher/samples.json:/app/samples.json:ro
      - ./group-watcher/faq.py:/app/faq.py:ro
      - ./kb/pages:/app/kb:ro
      - gw_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    depends_on:
      litellm: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Build only (docker compose --profile build build wa-connector, before building cw-rails): the WhatsApp connector
  # v0.9.0 from vendor/ with stack/patches/whatsapp-connector-outbound-stream.patch (call.start with a media stream,
  # for the voice agent's outbound calls). The Chatwoot Dockerfile copies its binary from this image.
  wa-connector:
    build:
      context: ../vendor/whatsapp-connector
      args: {VERSION: 0.9.0-stream}
    image: salesbot/whatsapp-connector:0.9.0-stream
    profiles: [build]

  # Voice agent (Pipecat + Gemini Live): WhatsApp calls handed over by the connector (/wa) and a browser test page.
  # Only on the VM's loopback until PUBLIC_DOMAIN has its A record: ssh -L 8090:localhost:8090 to try it.
  voice:
    build: ./voice
    image: salesbot/voice:local
    networks: [default]
    ports: ["127.0.0.1:8090:8090"]
    environment:
      GCP_PROJECT: ${GCP_PROJECT:?run render-env.sh}
      VOICE_LOCATION: ${VOICE_LOCATION:-eu}
      VOICE_NAME: ${VOICE_NAME:-Kore}
      MAX_CALLS: ${VOICE_MAX_CALLS:-2}
      MAX_CALL_SECS: ${VOICE_MAX_CALL_SECS:-600}
      DAILY_CALLS: ${VOICE_DAILY_CALLS:-40}
      # Call notes in Chatwoot: the group-watcher's API user (an automation that writes private notes).
      CW_ACCOUNT_ID: ${GW_CW_ACCOUNT_ID:-1}
      CW_API_TOKEN: ${GW_CW_TOKEN:-}
      CW_INBOX_ID: ${VOICE_CW_INBOX_ID:-2}
    volumes:
      - ./group-watcher/services.json:/app/services.json:ro
      - ./kb/pages:/app/kb:ro
      - ./voice/campaigns.json:/app/campaigns.json:ro
      - voice_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Public HTTPS entry (Let's Encrypt for PUBLIC_DOMAIN) in front of Chatwoot: UI and the WhatsApp Cloud webhook.
  caddy:
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    networks: [default]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on: [cw-rails]
    restart: unless-stopped

  # Mock dispatcher (ticket) service: stdlib Python + SQLite, internal network only (no published port).
  tickets:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: [python3, -I, -u, /app/server.py]
    networks: [internal]
    environment:
      TICKETS_API_TOKEN: ${TICKETS_API_TOKEN:?run render-env.sh}
      TICKETS_DB: /data/tickets.db
      # Monthly window for meter readings (days, inclusive) in the УК's local time; keep agent/knowledge.md in step.
      READINGS_WINDOW: ${READINGS_WINDOW:-20-25}
      UK_UTC_OFFSET: ${UK_UTC_OFFSET:-5}
    volumes:
      - ./tickets/server.py:/app/server.py:ro
      - tickets_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Telegram userbot (a real account, MTProto) <-> Chatwoot API inbox; groups -> /data queue (plan v2, spike S2).
  # Default deny: only chats allowed with `/salesbot allow` from the account itself. Session = secret (volume).
  tg-userbot:
    build: ./tg-userbot
    image: salesbot/tg-userbot:local
    profiles: [tg-userbot]
    networks: [default]
    environment:
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      CW_URL: http://cw-rails:3000
      CW_ACCOUNT_ID: ${CW_TGU_ACCOUNT_ID:-}
      CW_INBOX_IDENTIFIER: ${CW_TGU_INBOX_IDENTIFIER:-}
      CW_WEBHOOK_SECRET: ${CW_TGU_WEBHOOK_SECRET:-}
      CW_OPERATOR_TOKEN: ${CW_TGU_OPERATOR_TOKEN:-}
    volumes:
      - tgu_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
    depends_on: [cw-rails]
    restart: unless-stopped

  # Local speech-to-text (faster-whisper, model baked in at build). Voice notes stay inside the VM.
  stt:
    build:
      context: ./stt
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    image: salesbot/stt:local
    networks: [internal]
    environment:
      STT_API_TOKEN: ${STT_API_TOKEN:?run render-env.sh}
      STT_THREADS: "4"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  agents-postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=top, -c, pg_stat_statements.track_utility=off]
    environment:
      POSTGRES_DB: fazerai_agents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AGENTS_POSTGRES_PASSWORD:?}
    volumes:
      - agents_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fazerai_agents_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  default:
  # No route to the internet: stt and tickets need none (and onnxruntime inside stt carries telemetry code).
  internal:
    internal: true

volumes:
  cw_storage:
  wac_media:
  cw_postgres:
  redis_data:
  agents_storage:
  agents_postgres:
  tickets_data:
  tgu_data:
  caddy_data:
  caddy_config:
  gw_data:
  voice_data:
