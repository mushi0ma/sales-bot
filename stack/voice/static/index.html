<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звонок e-KNOT</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #e3e1dc; --accent: #1f7a4d; --stop: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe7; --muted: #9b9a95; --card: #20201e; --line: #2f2f2c; --accent: #3fae78; --stop: #e5675f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 12px 24px; color: #fff; background: var(--accent); cursor: pointer; }
  button.stop { background: var(--stop); }
  #status { margin-left: 12px; color: var(--muted); font-size: 14px; }
  #log { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .m { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; max-width: 85%; }
  .m.user { align-self: flex-end; }
  .m small { display: block; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Звонок помощнику e-KNOT</h1>
  <p class="hint">Тест голосового агента (Gemini Live). Нужны наушники или тихая комната: так бот не слышит сам себя.</p>
  <button id="call">Позвонить</button><span id="status"></span>
  <div id="log"></div>
</main>
<script>
const btn = document.getElementById('call'), statusEl = document.getElementById('status'), logEl = document.getElementById('log');
let ws, mic, inCtx, outCtx, node, playAt = 0, sources = [];

const worklet = `class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) { for (const s of ch) this.buf.push(Math.max(-1, Math.min(1, s))); }
    if (this.buf.length >= 1600) {  // 100 ms at 16 kHz
      const out = new Int16Array(this.buf.splice(0, 1600).map(s => s * 0x7fff));
      this.port.postMessage(out.buffer, [out.buffer]);
    }
    return true;
  }
}
registerProcessor('pcm', Pcm);`;

function line(who, text) {
  const d = document.createElement('div');
  d.className = 'm ' + who;
  d.innerHTML = '<small>' + (who === 'user' ? 'Вы' : 'e-KNOT') + '</small>';
  d.appendChild(document.createTextNode(text));
  logEl.appendChild(d);
  d.scrollIntoView({ block: 'end' });
}

function play(buf) {
  const pcm = new Int16Array(buf), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 0x8000;
  const b = outCtx.createBuffer(1, f.length, 24000);
  b.copyToChannel(f, 0);
  const s = outCtx.createBufferSource();
  s.buffer = b; s.connect(outCtx.destination);
  playAt = Math.max(playAt, outCtx.currentTime + 0.05);
  s.start(playAt); playAt += b.duration;
  sources.push(s); s.onended = () => { sources = sources.filter(x => x !== s); };
}

function silence() { sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources = []; playAt = 0; }

async function start() {
  btn.disabled = true; statusEl.textContent = 'Подключаюсь…';
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (e) { statusEl.textContent = 'Нет доступа к микрофону'; btn.disabled = false; return; }
  inCtx = new AudioContext({ sampleRate: 16000 });
  outCtx = new AudioContext({ sampleRate: 24000 });
  await inCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'application/javascript' })));
  node = new AudioWorkletNode(inCtx, 'pcm');
  inCtx.createMediaStreamSource(mic).connect(node);
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/\/?$/, '/') + 'browser');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { statusEl.textContent = 'Разговор идёт'; btn.textContent = 'Завершить'; btn.className = 'stop'; btn.disabled = false;
                      node.port.onmessage = e => { if (ws.readyState === 1) ws.send(e.data); }; };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') { play(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === 'interrupted') silence();
    if (m.type === 'transcript') line(m.who, m.text);
  };
  ws.onclose = stop;
}

function stop() {
  if (ws && ws.readyState <= 1) ws.close();
  if (mic) mic.getTracks().forEach(t => t.stop());
  silence();
  [inCtx, outCtx].forEach(c => c && c.state !== 'closed' && c.close());
  ws = mic = inCtx = outCtx = null;
  btn.textContent = 'Позвонить'; btn.className = ''; btn.disabled = false; statusEl.textContent = 'Звонок завершён';
}

btn.onclick = () => (ws ? stop() : start());
</script>
</body>
</html>
